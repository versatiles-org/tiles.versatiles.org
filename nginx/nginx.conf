worker_processes auto;
worker_rlimit_nofile 100000;

# How long a worker that has been told to stop (container stop, or the old
# workers after a reload) waits for its remaining connections before closing
# them. Without a limit, a single connection that is open but idle — browsers
# keep such spare connections — holds the shutdown until Docker kills the
# container after its stop timeout. While that lasts nothing listens on 80/443,
# because nginx stops accepting new connections first: on the production server
# every nginx container replacement took 11 seconds that way. Requests here take
# milliseconds, so 1s is ample. nginx then needs up to another second to exit;
# compose.yaml's stop_grace_period (3s) leaves room for that.
worker_shutdown_timeout 1s;

pid /run/nginx.pid;

include /etc/nginx/modules-enabled/*.conf;

events {
   worker_connections 10000;
   multi_accept on;
   use epoll;
}

http {
   server_tokens off;

   open_file_cache max=300000 inactive=60s;
   open_file_cache_valid 45s;
   open_file_cache_min_uses 2;
   open_file_cache_errors on;

   sendfile on;
   tcp_nopush on;
   tcp_nodelay on;

   reset_timedout_connection on;
   client_body_timeout 10;
   send_timeout 2;
   keepalive_timeout 30;
   keepalive_requests 5000;

   types_hash_max_size 2048;
   server_names_hash_bucket_size 128;

   include /etc/nginx/mime.types;
   default_type application/octet-stream;

   # IP anonymization: zero last octet for IPv4, last 80 bits for IPv6
   map $remote_addr $remote_addr_anon {
      ~(?P<ip>\d+\.\d+\.\d+)\.    $ip.0;
      ~(?P<ip>[^:]+:[^:]+):       $ip::;
      default                     0.0.0.0;
   }

   # The log formats that use $remote_addr_anon are defined in
   # templates/proxy.conf.template, next to the access_log lines.

   # Rate limiting zone: 200 requests per second per IP with burst. Sized for
   # tile/asset proxying only — the bulk .versatiles downloads moved to the CDN,
   # so per-request cost is tiny (nginx cache + local disk) and a single
   # MapLibre view / shared NAT IP needs plenty of headroom.
   limit_req_zone $binary_remote_addr zone=tiles:10m rate=200r/s;
   limit_req_status 429;

   access_log off;

   gzip_static off;

   disable_symlinks if_not_owner;

   include /etc/nginx/conf.d/*.conf;
}
