# This is what the nginx container sees as /etc/nginx/nginx.conf. It only pulls
# in the real configuration, nginx/nginx.conf, through the directory mount of
# ./nginx at /etc/nginx/repo.
#
# Why the detour: compose mounts this file into the container as a single file,
# and a single-file mount stays tied to the file as it was when the container
# started — `git pull` replaces a changed file with a new one, which the
# container never sees. A directory mount does not have that problem. So the
# settings live in a file that is reached through a directory mount, and a
# plain `nginx -s reload` picks up changes to it.
#
# Keep this file as it is. A change here only takes effect when the nginx
# container is recreated.
include /etc/nginx/repo/nginx.conf;
