name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        # Lints every tracked shell script, wherever it lives (bin/, download/,
        # nginx/docker-entrypoint.d/). ShellCheck is preinstalled on the runner.
        run: |
          shellcheck --version
          git ls-files -z '*.sh' '*.envsh' | xargs -0 shellcheck

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker compose
        run: |
          cp template.env .env
          docker compose config --quiet

  # The nginx template renders and loads in the pinned nginx image.
  nginx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: nginx config test
        run: ./tests/nginx-config.sh

  # The updater image builds, and update-tiles.sh generates the expected
  # tile server configuration from download/sources.json.
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update pipeline test
        run: ./tests/pipeline.sh

  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: YAML lint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: compose.yaml
          config_data: |
            extends: relaxed
            rules:
              line-length: disable
