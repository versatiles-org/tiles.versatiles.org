version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      all-github-actions:
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"

  # Image tags in compose.yaml (versatiles, nginx, certbot). The versatiles pin
  # there also sets the version used by the download-updater image.
  # Deliberately not grouped: these are three unrelated services with different
  # risks, so each image gets a pull request of its own that can be tested,
  # merged or left open independently (see "Upgrading versatiles" in the README).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  # Base image of the download-updater Dockerfile (alpine).
  - package-ecosystem: docker
    directory: /download
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      all-docker:
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
