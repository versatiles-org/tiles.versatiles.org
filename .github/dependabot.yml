version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      all-github-actions:
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"

  # Image tags in compose.yaml (versatiles, nginx, certbot). The versatiles pin
  # there also sets the version used by the download-updater image.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      all-docker-compose:
        patterns:
          - "*"
        # A new versatiles major gets a PR of its own: it needs the checks in
        # the README ("Upgrading versatiles") before it may reach production.
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - "*"

  # Base image of the download-updater Dockerfile (alpine).
  - package-ecosystem: docker
    directory: /download
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      all-docker:
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
