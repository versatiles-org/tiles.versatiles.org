version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      all-github-actions:
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"

  # Image tags in compose.yaml (nginx, certbot). versatiles uses the moving
  # `latest` tag and is not managed here (see "Upgrading versatiles" in the
  # README). Deliberately not grouped: these are unrelated services with
  # different risks, so each image gets a pull request of its own that can be
  # tested, merged or left open independently.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  # Base image of the download-updater Dockerfile (alpine).
  - package-ecosystem: docker
    directory: /download
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      all-docker:
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
