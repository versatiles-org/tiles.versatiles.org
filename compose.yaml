# Size limit for what the long-running containers write to stdout/stderr
# (`docker compose logs`). Docker's default keeps these files forever; the tile
# server writes several lines for every failed request, so without a limit they
# grow without bound. nginx's own access/error logs are separate files in
# volumes/nginx-log, rotated by bin/log/rotate.sh.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  versatiles:
    # No container_name on purpose: to replace the tile server without a gap,
    # a second container of this service runs next to the first for a moment
    # (replace_tile_server in bin/deploy/helpers.sh), and a fixed name would
    # forbid that. Address it by service: `docker compose exec versatiles …`.
    logging: *logging
    # Pinned on purpose: `bin/update.sh` runs `docker compose pull`, so a moving
    # tag would upgrade production unreviewed. This is the only place the
    # version is set — download-updater takes its versatiles binary from the
    # same image via the anchor below, so the two can never drift apart.
    image: &versatiles_image versatiles/versatiles:v5.0.0
    restart: always
    networks: [docker_network]
    expose: [8080]
    command: ["serve", "-c", "/config_dir/versatiles.yaml"]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - ${TILES_DIR:-./volumes/tiles}:/data/tiles/:ro
      - ./volumes/frontend/:/data/frontend/:ro
      - ./volumes/versatiles_conf/:/config_dir/:ro

  download-updater:
    container_name: download-updater
    build:
      context: ./download
      dockerfile: Dockerfile
      args:
        VERSATILES_IMAGE: *versatiles_image
    profiles: [donotstart]
    networks: [docker_network]
    environment:
      - CDN_BASE_URL=${CDN_BASE_URL:-https://cdn.versatiles.cloud}
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${TILES_DIR:-./volumes/tiles}:/volumes/tiles:rw
      - ./volumes/versatiles_conf:/volumes/versatiles_conf:rw

  nginx:
    container_name: nginx
    logging: *logging
    # nginx gets SIGQUIT (graceful) and stops accepting connections at once;
    # nginx.conf's worker_shutdown_timeout (1s) makes it exit within about 2s.
    # This is the backstop if it does not. Docker's default of 10s meant 11 seconds with
    # nothing listening on 80/443 whenever the container was replaced.
    stop_grace_period: 3s
    image: nginx:1.31-alpine
    restart: always
    depends_on:
      versatiles:
        condition: service_healthy
    networks: [docker_network]
    ports: [80:80, 443:443]
    volumes:
      # nginx.conf reaches the container through the directory mount below, not
      # as a single file: a single-file mount keeps showing the old content
      # after `git pull` replaces the file. See nginx/nginx.stub.conf.
      - ./nginx/nginx.stub.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/:/etc/nginx/repo/:ro
      - ./nginx/templates/:/etc/nginx/templates/:ro
      - ./volumes/cache/:/data/nginx/cache/:rw
      - ./volumes/certbot-www/:/var/www/certbot/:ro
      - ./volumes/nginx-cert/:/etc/nginx/ssl/:ro
      - ./volumes/nginx-log/:/var/log/nginx/:rw
      # Run by the image's entrypoint at container start, which only looks in
      # /docker-entrypoint.d — hence a single-file mount. A reload sources the
      # current copy from /etc/nginx/repo instead (nginx_render_and_reload).
      - ./nginx/docker-entrypoint.d/10-compute-cache-size.envsh:/docker-entrypoint.d/10-compute-cache-size.envsh:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
      - RAM_DISK_GB=${RAM_DISK_GB}

  certbot:
    container_name: certbot
    image: certbot/certbot:v5.8.0
    # No depends_on on purpose: certbot needs the *running* nginx to serve its
    # challenge files, but `docker compose run` must not manage nginx for it —
    # that would recreate nginx (and the tile server) whenever their compose
    # state has changed. The cert scripts check that nginx is up themselves.
    profiles: [donotstart]
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./volumes/certbot-cert/:/etc/letsencrypt/:rw
      - ./volumes/certbot-www/:/var/www/certbot/:rw

networks:
  docker_network:
    driver: bridge
