server:
  ip: "0.0.0.0"
  port: 8080

static:
  - src: /data/frontend/frontend.br.tar
  - src: /data/frontend/styles.tar
    prefix: /assets/styles

tiles:
  - name: elevation-raster
    src: /data/tiles/elevation-raster.versatiles
    aliases: ["elevation"]
  - name: hillshade-vector
    src: /data/tiles/hillshade-vector.versatiles
    aliases: ["hillshade-vectors"]
  - name: bathymetry-vector
    src: /data/tiles/bathymetry-vector.versatiles
    aliases: ["bathymetry-vectors"]
  - name: landcover-vector
    src: /data/tiles/landcover-vector.versatiles
    aliases: ["landcover-vectors"]
  - name: osm-vector
    src: /data/tiles/osm-vector.versatiles
    aliases: ["osm"]
  - name: satellite-raster
    src: /config_dir/satellite-raster.serve.vpl
    aliases: ["satellite"]
