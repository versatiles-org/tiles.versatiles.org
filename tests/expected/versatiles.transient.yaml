server:
  ip: "0.0.0.0"
  port: 8080

static:
  - src: /data/frontend/frontend.br.tar
  - src: /data/frontend/styles.tar
    prefix: /assets/styles

tiles:
  - name: elevation-raster
    src: https://cdn.versatiles.cloud/elevation-raster/elevation-raster.versatiles
    aliases: ["elevation"]
  - name: hillshade-vector
    src: https://cdn.versatiles.cloud/hillshade-vector/hillshade-vector.versatiles
    aliases: ["hillshade-vectors"]
  - name: bathymetry-vector
    src: https://cdn.versatiles.cloud/bathymetry-vector/bathymetry-vector.versatiles
    aliases: ["bathymetry-vectors"]
  - name: landcover-vector
    src: https://cdn.versatiles.cloud/landcover-vector/landcover-vector.versatiles
    aliases: ["landcover-vectors"]
  - name: osm-vector
    src: https://cdn.versatiles.cloud/osm-vector/osm-vector.versatiles
    aliases: ["osm"]
  - name: satellite-raster
    src: https://cdn.versatiles.cloud/satellite-raster/satellite-raster.versatiles
    aliases: ["satellite"]
